[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-mcp"
version = "0.1.0"
description = "使用 AI 技术生成 SQL 的 PostgreSQL MCP 服务器"
authors = [{name = "AI Coding Bootcamp"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"

keywords = ["postgres", "mcp", "sql", "llm", "kimi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=0.1.0",
    "asyncpg>=0.29.0",
    "sqlglot>=20.0.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit>=1.7.8",
    "pre-commit>=3.8.0",
    "testcontainers>=4.0.0",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/buoge/pg-mcp"
Repository = "https://github.com/buoge/pg-mcp"
Issues = "https://github.com/buoge/pg-mcp/issues"

[project.scripts]
pg-mcp = "pg_mcp.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pg_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=pg_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=85",
    "--asyncio-mode=auto",
]
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "slow: 耗时较长的测试",
    "security: 安全测试",
]

[tool.coverage.run]
source = ["pg_mcp"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PL",  # pylint
    "TCH", # flake8-type-checking
    "ANN", # flake8-annotations
]
ignore = [
    "PLR2004",  # 魔术值比较
    "PLR0913",  # 参数过多
    "ANN101",   # 缺少 self 类型
    "ANN102",   # 缺少 cls 类型
]

[tool.ruff.lint.isort]
known-first-party = ["pg_mcp"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
check_untyped_defs = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "mcp.*", "openai.*"]
ignore_missing_imports = true
