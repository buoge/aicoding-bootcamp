name: Compass
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.0
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-packages
      - name: Verify learner data from Git LFS
        run: |
          git lfs install --local
          git lfs pull --include="data/retail/compass-retail.sql.gz" --exclude=""
          pnpm data:prepare
      - run: pnpm check
      - run: pnpm build
      - run: pnpm run deploy
      - name: Web PostgreSQL and recovery acceptance
        env:
          WEB_TEST_DATABASE_URL: postgresql://compass_web_runtime:compass_web_runtime_local_only@127.0.0.1:55432/compass_web_test_ci
          WEB_TEST_MIGRATION_DATABASE_URL: postgresql://compass_web_migrator:compass_web_migration_local_only@127.0.0.1:55432/compass_web_test_ci
          WEB_TEST_ADMIN_URL: postgresql://compass:compass_local_only@127.0.0.1:55432/compass
          WEB_TEST_PG_CONTAINER: compass-postgres-1
        run: |
          pnpm test:setup -F web
          pnpm test:integration -F web
      - name: Web browser acceptance
        env:
          WEB_TEST_DATABASE_URL: postgresql://compass_web_runtime:compass_web_runtime_local_only@127.0.0.1:55432/compass_web_test_browser
          WEB_TEST_MIGRATION_DATABASE_URL: postgresql://compass_web_migrator:compass_web_migration_local_only@127.0.0.1:55432/compass_web_test_browser
          WEB_TEST_ADMIN_URL: postgresql://compass:compass_local_only@127.0.0.1:55432/compass
          WEB_TEST_PASSWORD: teaching-995-only-password
        run: |
          pnpm test:setup -F web -- --fixture teaching
          pnpm --filter @compass/web exec playwright install --with-deps chromium
          pnpm test:e2e -F web
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-web-browser-evidence
          path: work/995-playwright*
          if-no-files-found: ignore
      - if: failure()
        run: pnpm deploy:logs
      - if: always()
        run: pnpm deploy:down
